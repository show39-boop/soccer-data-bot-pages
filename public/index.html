<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071d47">
  <title>サッカーデータbot</title>
  <style>
    :root{--navy:#06285c;--blue:#1479f5;--ink:#102c5a;--muted:#64748b;--line:#e7edf5}*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}.app{max-width:720px;margin:auto;min-height:100vh;background:#fff}.hero{background:linear-gradient(130deg,#071d47,#0c3e83);color:#fff;padding:28px 22px 19px}.brand{display:flex;gap:12px;align-items:center}.ball{font-size:36px}.hero h1{font-size:26px;margin:0;font-weight:800}.content{padding:14px 16px 32px}.tabs{display:flex;background:#edf2f8;padding:4px;border-radius:16px;gap:4px}.tab{flex:1;border:0;background:transparent;border-radius:12px;padding:12px 8px;color:#355072;font-weight:700;font-size:15px;cursor:pointer}.tab.active{background:var(--blue);color:#fff;box-shadow:0 4px 10px #1479f540}.updated{font-size:13px;color:#526782;margin:16px 4px;display:flex;align-items:center;justify-content:space-between;gap:8px}.refresh{border:1px solid #cbd9e9;border-radius:8px;background:#fff;color:#355072;font-size:12px;padding:5px 8px;cursor:pointer}.refresh:disabled{opacity:.6;cursor:wait}.summary{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,#f0f8ff,#d9edff);border-radius:15px;padding:16px;margin-bottom:14px}.summary i{font-size:28px;font-style:normal}.summary small{font-size:13px;color:#1164cf;font-weight:700}.summary strong{display:block;font-size:28px;color:#096ae6;margin-top:2px}.match-list{display:grid;gap:10px}.match{width:100%;display:grid;grid-template-columns:66px 1fr 20px;gap:8px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:15px;background:#fff;padding:14px 12px;box-shadow:0 3px 12px #0d2f6209;color:inherit;cursor:pointer}.match:disabled{cursor:default}.time{font-size:18px;font-weight:800}.league{font-size:11px;color:#58708f;margin-top:3px}.teams{display:grid;grid-template-columns:1fr 24px 1fr;gap:6px;align-items:center;min-width:0}.team{font-weight:700;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.team:last-child{text-align:right}.rank{display:block;width:max-content;background:#f0f4f9;border-radius:5px;padding:3px 6px;color:#4f6582;font-weight:500;font-size:11px;margin-top:5px}.team:last-child .rank{margin-left:auto}.vs{text-align:center;font-weight:700;color:#607692;font-size:12px}.arrow{font-size:26px;color:#446587}.empty,.error{padding:35px 14px;text-align:center;border:1px dashed #ced9e7;border-radius:15px;color:var(--muted)}.error{color:#bd1e32;border-color:#f1bcc5}.dashboard{display:none}.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric,.rate{border:1px solid var(--line);border-radius:15px;padding:14px;background:#fff;box-shadow:0 2px 10px #0d2f6208}.metric small,.rate small{display:block;font-weight:700;font-size:13px;color:#3e5879}.metric strong{display:block;font-size:27px;line-height:1.25;color:#073b83;margin-top:8px}.rate-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.rate{padding:12px 7px;text-align:center}.rate small{font-size:11px}.rate strong{font-size:19px;color:#073b83;display:block;margin-top:6px}.table-card{margin-top:14px;border:1px solid var(--line);border-radius:15px;padding:13px;overflow:auto}.table-card h3{margin:0 0 10px;font-size:16px}table{border-collapse:collapse;width:100%;min-width:570px;font-size:12px}td{border:1px solid var(--line);padding:7px;text-align:right}td:first-child{text-align:left}tr:first-child td{font-weight:bold;background:#f4f8fc}@media(min-width:700px){.app{box-shadow:0 0 40px #102c5a18}.content{padding:18px 28px 36px}.match{padding:16px}.team{font-size:15px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="hero"><div class="brand"><div class="ball">⚽</div><h1>サッカーデータbot</h1></div></header>
    <div class="content">
      <nav class="tabs" aria-label="画面切替"><button class="tab active" data-page="matches">当日試合</button><button class="tab" data-page="dashboard">ダッシュボード</button></nav>
      <div class="updated"><span id="updated">◷ 最終更新を取得中…</span><button type="button" class="refresh" id="refresh">↻ 更新</button></div>
      <section id="matches"></section>
      <section id="dashboard" class="dashboard"></section>
    </div>
  </main>
  <script>
    const CACHE_KEY='soccer-data-bot.matches.v2';
    const TOKYO_TZ='Asia/Tokyo';
    let refreshTimer=null;
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function renderMatches(matches){const root=document.querySelector('#matches');if(!matches.length){root.innerHTML='<div class="summary"><i>📅</i><div><small>本日の対象試合</small><strong>0 試合</strong></div></div><div class="empty">本日の対象試合はありません</div>';return}root.innerHTML='<div class="summary"><i>📅</i><div><small>本日の対象試合</small><strong>'+matches.length+' 試合</strong></div></div><div class="match-list">'+matches.map(m=>'<button class="match" '+(m.url?'data-url="'+esc(m.url)+'"':'disabled')+'><div><div class="time">'+esc(m.time)+'</div><div class="league">'+esc(m.competition)+'</div></div><div class="teams"><div class="team">'+esc(m.home)+(m.homeRank?'<span class="rank">'+esc(m.homeRank)+'</span>':'')+'</div><div class="vs">VS</div><div class="team">'+esc(m.away)+(m.awayRank?'<span class="rank">'+esc(m.awayRank)+'</span>':'')+'</div></div><div class="arrow">›</div></button>').join('')+'</div>'}
    function table(title,rows){if(!rows?.length)return '';return '<div class="table-card"><h3>'+title+'</h3><table>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</table></div>'}
    function renderDashboard(d){const metric=(l,v)=>'<article class="metric"><small>'+l+'</small><strong>'+esc(v||'—')+'</strong></article>';const rate=(l,v)=>'<article class="rate"><small>'+l+'</small><strong>'+esc(v||'—')+'</strong></article>';document.querySelector('#dashboard').innerHTML='<div class="metric-grid">'+metric('📋 検証済み試合数',d.verifiedMatches)+metric('⚽ 前半ゴール確率',d.firstHalfGoalRate)+metric('⏱️ 15〜45分ゴール確率',d.goal15to45Rate)+metric('🕐 平均初ゴール時間',d.averageFirstGoalTime)+'</div><div class="rate-grid">'+rate('🏠 ホーム勝率',d.homeWinRate)+rate('🤝 引き分け率',d.drawRate)+rate('✈️ アウェー勝率',d.awayWinRate)+'</div>'+table('📈 累計推移（直近30日）',d.trendRows)}
    function setLastUpdated(value){document.querySelector('#updated').textContent='◷ 最終更新 '+(value||'—')}
    function tokyoParts(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:TOKYO_TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());const out={};parts.forEach(p=>{if(p.type!=='literal')out[p.type]=Number(p.value)});return out}
    function cacheSlot(){const p=tokyoParts();const d=new Date(Date.UTC(p.year,p.month-1,p.day));if(p.hour<11||(p.hour===11&&p.minute<30))d.setUTCDate(d.getUTCDate()-1);return d.toISOString().slice(0,10)}
    function readMatchCache(){try{const value=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');return value&&value.slot===cacheSlot()&&Array.isArray(value.matches)?value:null}catch{return null}}
    function saveMatchCache(data){try{localStorage.setItem(CACHE_KEY,JSON.stringify({slot:cacheSlot(),matches:data.matches||[],lastUpdatedAt:data.lastUpdatedAt||'',savedAt:Date.now()}))}catch(error){console.warn('cache save failed',error)}}
    async function api(path){const response=await fetch(path,{headers:{Accept:'application/json'}});if(!response.ok)throw new Error('データ取得に失敗しました ('+response.status+')');return response.json()}
    async function loadDashboard(){try{renderDashboard(await api('/api/dashboard'));document.body.dataset.dashboardSource='api'}catch(error){console.error(error)}}
    async function loadMatches(force){const button=document.querySelector('#refresh');button.disabled=true;button.textContent='更新中…';try{const data=await api('/api/matches'+(force?'?refresh=1':''));saveMatchCache(data);renderMatches(data.matches||[]);setLastUpdated(data.lastUpdatedAt);document.body.dataset.matchSource='api'}catch(error){console.error(error);if(!readMatchCache()){document.querySelector('#updated').textContent='データを取得できませんでした';document.querySelector('#matches').innerHTML='<div class="error">再読み込みしてください</div>'}}finally{button.disabled=false;button.textContent='↻ 更新'}}
    function scheduleNextRefresh(){if(refreshTimer)clearTimeout(refreshTimer);const p=tokyoParts();let target=Date.UTC(p.year,p.month-1,p.day,2,30,1);if(target<=Date.now())target+=86400000;refreshTimer=setTimeout(async()=>{await loadMatches(false);scheduleNextRefresh()},target-Date.now())}
    function initialize(){document.querySelectorAll('.tab').forEach(button=>{button.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));button.classList.add('active');document.querySelector('#matches').style.display=button.dataset.page==='matches'?'block':'none';document.querySelector('#dashboard').style.display=button.dataset.page==='dashboard'?'block':'none'}});document.querySelector('#matches').addEventListener('click',event=>{const card=event.target.closest('[data-url]');if(card)window.open(card.dataset.url,'_blank','noopener,noreferrer')});document.querySelector('#refresh').addEventListener('click',()=>loadMatches(true));const cache=readMatchCache();if(cache){renderMatches(cache.matches);setLastUpdated(cache.lastUpdatedAt);document.body.dataset.matchSource='cache'}else{loadMatches(false)}loadDashboard();scheduleNextRefresh()}
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initialize);else initialize();
  </script>
</body>
</html>
