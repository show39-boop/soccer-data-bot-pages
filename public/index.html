<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102d55">
  <meta name="description" content="サッカーデータbotの試合前データと検証結果を確認できる、閲覧専用ダッシュボード。">
  <title>サッカーデータbot</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="header">
    <div class="header-inner"><a class="brand" href="#matches"><span aria-hidden="true">⚽</span> サッカーデータbot</a><span class="version">V3.1 <span>・閲覧専用</span></span></div>
  </header>
  <main class="container">
    <div class="toolbar">
      <nav class="tabs" aria-label="メイン画面">
        <button type="button" id="tab-matches" data-page="matches" aria-pressed="true">本日の試合</button>
        <button type="button" id="tab-dashboard" data-page="dashboard" aria-pressed="false">分析ダッシュボード</button>
      </nav>
      <button type="button" id="refresh" class="refresh">↻ 更新</button>
    </div>
    <div id="feedback" role="status" aria-live="polite"></div>
    <section id="matches" aria-labelledby="matches-title">
      <div class="section-heading"><div><p class="eyebrow">MATCH DAY</p><h1 id="matches-title">本日の試合一覧</h1><p class="description">保存済みの対象試合を、開始時刻順に。</p></div><div class="count-box"><span>対象試合</span><strong id="match-count">—<small> 試合</small></strong></div></div>
      <p class="updated" id="matches-updated">最終更新を確認中…</p>
      <div class="filters" role="search" aria-label="試合の検索と絞り込み">
        <label>チーム名<input id="team-search" type="search" placeholder="チームを検索" autocomplete="off"></label>
        <label>大会名<input id="league-search" type="search" placeholder="大会を検索" autocomplete="off"></label>
        <label>シーズン進行度<select id="season-filter"><option value="">すべて</option><option value="○">○ 対象</option><option value="×">× 対象外</option><option value="判定不可">判定不可</option></select></label>
      </div>
      <div class="list-meta"><span id="shown-count"></span><span>開始時刻順 ↑ ・日本時間</span></div>
      <div id="match-list" class="match-grid" aria-busy="true"><p class="state">試合データを読み込んでいます…</p></div>
      <p class="footnote">シーズン進行度・取得状態は保存値を表示しています。未取得の項目は「—」です。</p>
    </section>
    <section id="dashboard" aria-labelledby="dashboard-title" hidden>
      <div class="section-heading"><div><p class="eyebrow">DATA & INSIGHTS</p><h1 id="dashboard-title">分析ダッシュボード</h1><p class="description">積み重ねた検証結果を、ひと目で。</p></div></div>
      <p class="updated" id="dashboard-updated">最終更新を確認中…</p>
      <div id="dashboard-content" aria-busy="true"><p class="state">ダッシュボードを読み込んでいます…</p></div>
    </section>
    <footer>API-Footballデータによる検証記録 <span>時刻は日本時間（JST）</span></footer>
  </main>
  <dialog id="match-detail" aria-labelledby="detail-title"><div class="dialog-top"><span>試合前データ</span><button type="button" id="close-detail" aria-label="試合詳細を閉じる">×</button></div><div id="detail-content"></div></dialog>
  <noscript><p class="state">JavaScriptを有効にしてご利用ください。</p></noscript>
</body>
</html>
